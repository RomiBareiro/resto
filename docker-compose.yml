version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: romi
      POSTGRES_PASSWORD: romi
      POSTGRES_DB: romi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U romi"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db_creation:/docker-entrypoint-initdb.d

  resto_go:
    build: .
    ports:
      - "8080:8080"
    command: ["/resto_go"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://romi:romi@db:5432/romi?sslmode=disable"

volumes:
  db_data:
